name: Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inline JS syntax
        run: node scripts/check-inline-js.mjs
      - name: Edge function tests
        run: node --experimental-strip-types --test supabase/tests/*.test.ts

  # בדיקות דפדפן ב-390px עם Supabase מדומה (בלי רשת חיצונית). הרצה מקומית חוזרת עברה יציב,
  # אבל ה-job הזה טרם הורץ על runner של GitHub, ולכן ההרצה הראשונה היא גם האימות שלו.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Smoke at 390px
        run: node scripts/smoke-390.mjs
      - name: UX interactions (touch)
        run: node scripts/test-ux-interactions.mjs
      - name: Tracking requests are really sent
        run: node scripts/test-tracking-requests.mjs
      - name: Google sign-in return is not signed out
        run: node scripts/test-oauth-return.mjs
      - name: Launch polish (floating buttons, RTL, escaping, wording, errors)
        run: node scripts/test-launch-polish.mjs
      - name: Today screen, next step and lost deals
        run: node scripts/test-today.mjs
      - name: Industry persistence and general-business wizard
        run: node scripts/test-industry.mjs
      - name: WhatsApp templates without AI
        run: node scripts/test-wa-templates.mjs
      - name: AI off, no dead AI controls in tools and lead card
        run: node scripts/test-ai-off.mjs
      - name: Annual upsell stays off while AI is off
        run: node scripts/test-upsell-off.mjs
      - name: Lead documents (private files, external and internal sharing)
        run: node scripts/test-lead-docs.mjs
      - name: Client document page (doc.html)
        run: node scripts/test-doc-page.mjs
      - name: Launch readiness (phone validation, no false claims, no ~~ placeholders)
        run: node scripts/test-readiness.mjs
      - name: Landing page claims and layout
        run: node scripts/test-landing.mjs
      - name: Landing page CTAs and copy
        run: node scripts/test-landing-cta.mjs
      - name: 45-day trial (migration 134, trial bar, copy)
        run: node scripts/test-trial-45.mjs
      - name: Paywall after trial end (stays on paywall, one owner alert)
        run: node scripts/test-paywall-expired.mjs
