name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy ai-proxy
        run: supabase functions deploy ai-proxy --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # notify-owner sends the owner notifications by email through the
      # _notify_owner_email() database helper (Resend key in Vault). It needs no
      # extra secret; it uses the platform SUPABASE_* variables.
      - name: Deploy notify-owner
        run: supabase functions deploy notify-owner --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # gmail-proxy בודק בעצמו משתמש מאומת ובעלים (לפי uid), ולכן בלי אימות JWT בשער.
      - name: Deploy gmail-proxy
        run: supabase functions deploy gmail-proxy --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # twilio-whatsapp נפרס עם אימות JWT בשער (כמו בפריסה החיה), ובודק גם בעצמו.
      - name: Deploy twilio-whatsapp
        run: supabase functions deploy twilio-whatsapp --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # document-share: קישור ציבורי ללקוח (בלי התחברות). הטוקן נבדק ב-resolve_document_share (מיגרציה 133).
      - name: Deploy document-share
        run: supabase functions deploy document-share --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # gmail-oauth-callback מושבת (מחזיר 410). נפרס כדי שהגרסה החיה תהיה הגרסה המושבתת.
      - name: Deploy gmail-oauth-callback
        run: supabase functions deploy gmail-oauth-callback --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
