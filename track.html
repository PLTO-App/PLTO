<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>מעקב חי, PLTO</title>
  <meta name="description" content="מעקב חי אחרי העסקה, התיק או הפרויקט שלך">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://scyfywvzoogfrlalgftv.supabase.co; connect-src 'self' https://scyfywvzoogfrlalgftv.supabase.co; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Supabase (same version as index.html/page.html/portfolio.html) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.2/dist/umd/supabase.js"
          integrity="sha384-nD3dwv4+ZqdYnmZKe/249ImlV04om7xTCcsoSeQYI+RO+XlKPoqAWaJR1M5SJH9p"
          crossorigin="anonymous"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:      #0F1F3D;
      --blue:      #2563EB;
      --purple:    #7C3AED;
      --green:     #16A34A;
      --gray-50:   #f8fafc;
      --gray-100:  #f1f5f9;
      --gray-200:  #e2e8f0;
      --gray-400:  #94a3b8;
      --gray-500:  #64748b;
      --gray-700:  #334155;
      --gray-900:  #0f172a;
      --white:     #ffffff;
      --radius:    12px;
      --shadow:    0 4px 24px rgba(0,0,0,0.08);
    }

    html, body {
      min-height: 100vh;
      font-family: 'Heebo', sans-serif;
      background: #f0f4ff;
      color: var(--gray-900);
      direction: rtl;
    }

    .page-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }

    .header-card {
      background: var(--navy);
      border-radius: var(--radius);
      padding: 22px 24px;
      text-align: center;
      width: 100%;
      max-width: 560px;
      margin-bottom: 16px;
    }
    .page-logo { font-size: 20px; font-weight: 900; color: var(--white); letter-spacing: -0.5px; }
    .header-name { font-size: 15px; font-weight: 700; color: rgba(255,255,255,0.92); margin-top: 6px; overflow-wrap: break-word; word-break: break-word; }
    .header-sub { font-size: 12.5px; color: rgba(255,255,255,0.55); margin-top: 3px; overflow-wrap: break-word; word-break: break-word; }

    #state-loading, #state-ready, #state-unavailable { display: none; width: 100%; max-width: 560px; }
    #state-loading.active, #state-ready.active, #state-unavailable.active { display: block; }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--gray-200);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 60px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .card { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 18px 20px; margin-bottom: 14px; }
    .card-title { font-size: 14px; font-weight: 800; color: var(--gray-700); margin-bottom: 12px; }

    .won-banner {
      background: linear-gradient(135deg,#16A34A,#22C55E);
      color: var(--white);
      border-radius: var(--radius);
      padding: 16px 18px;
      text-align: center;
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }

    /* stage timeline */
    .stage-track { display: flex; flex-direction: column; gap: 0; }
    .stage-row { display: flex; align-items: flex-start; gap: 12px; position: relative; padding-bottom: 18px; }
    .stage-row:last-child { padding-bottom: 0; }
    .stage-dot-wrap { display: flex; flex-direction: column; align-items: center; }
    .stage-dot { width: 16px; height: 16px; border-radius: 50%; background: var(--gray-200); border: 3px solid var(--white); box-shadow: 0 0 0 2px var(--gray-200); flex-shrink: 0; }
    .stage-dot.done { background: var(--green); box-shadow: 0 0 0 2px var(--green); }
    .stage-dot.current { background: var(--blue); box-shadow: 0 0 0 4px rgba(37,99,235,0.22); }
    .stage-line { width: 2px; flex: 1; background: var(--gray-200); margin-top: 2px; min-height: 18px; }
    .stage-line.done { background: var(--green); }
    .stage-label { font-size: 13.5px; font-weight: 600; color: var(--gray-500); padding-top: 0px; }
    .stage-label.current { color: var(--navy); font-weight: 800; }
    .stage-label.done { color: var(--gray-700); }

    /* checklist */
    .cl-item { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: 13.5px; color: var(--gray-500); }
    .cl-item.done { color: var(--gray-900); font-weight: 600; }
    .cl-check { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--gray-200); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--white); }
    .cl-check.done { background: var(--green); border-color: var(--green); }
    .cl-progress { font-size: 11.5px; color: var(--gray-400); margin-bottom: 8px; }

    /* updates feed */
    .upd-item { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--gray-100); }
    .upd-item:last-child { border-bottom: none; }
    .upd-icon { font-size: 18px; width: 26px; text-align: center; flex-shrink: 0; }
    .upd-title { font-size: 13.5px; font-weight: 700; color: var(--gray-900); overflow-wrap: break-word; word-break: break-word; }
    .upd-detail { font-size: 12.5px; color: var(--gray-500); margin-top: 2px; line-height: 1.5; overflow-wrap: break-word; word-break: break-word; }
    .upd-time { font-size: 11px; color: var(--gray-400); margin-top: 3px; }

    .disclaimer { font-size: 11px; color: var(--gray-400); text-align: center; line-height: 1.6; margin-top: 4px; }

    .unavail-icon { font-size: 44px; text-align: center; margin-bottom: 10px; }
    .unavail-title { font-size: 18px; font-weight: 800; color: var(--gray-700); text-align: center; margin-bottom: 6px; }
    .unavail-msg { font-size: 13px; color: var(--gray-500); text-align: center; line-height: 1.6; }
    .state-box { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); padding: 32px 24px; }

    .page-footer { margin-top: 10px; font-size: 11.5px; color: var(--gray-400); text-align: center; line-height: 1.6; }
    .page-footer a { color: var(--blue); text-decoration: none; }
  </style>
</head>
<body>
<div class="page-wrap">
  <div class="header-card">
    <div class="page-logo">PLTO</div>
    <div class="header-name" id="hdr-name"></div>
    <div class="header-sub" id="hdr-sub">מעקב חי</div>
  </div>

  <!-- ── Loading ── -->
  <div id="state-loading" class="active">
    <div class="spinner"></div>
  </div>

  <!-- ── Ready ── -->
  <div id="state-ready">
    <div id="won-banner-slot"></div>

    <div class="card">
      <div class="card-title" id="stage-card-title">שלב נוכחי</div>
      <div class="stage-track" id="stage-track"></div>
    </div>

    <div class="card" id="checklist-card" style="display:none;">
      <div class="card-title" id="checklist-card-title">התקדמות</div>
      <div class="cl-progress" id="cl-progress"></div>
      <div id="checklist-list"></div>
    </div>

    <div class="card" id="updates-card" style="display:none;">
      <div class="card-title">מה קורה בפועל</div>
      <div id="updates-list"></div>
    </div>

    <div class="disclaimer" id="lawyer-disclaimer" style="display:none;">
      עמוד זה מציג סטטוס תהליכי בלבד, ואינו מהווה ייעוץ משפטי.
    </div>
  </div>

  <!-- ── Unavailable: identical for "not found" and "tenant inactive" ── -->
  <div id="state-unavailable">
    <div class="state-box">
      <div class="unavail-icon">🔗</div>
      <div class="unavail-title">העמוד אינו זמין</div>
      <div class="unavail-msg">
        ייתכן שהקישור שגוי או שהעמוד כבר אינו פעיל.<br>
        כדאי לבקש קישור מעודכן ממי ששלח אותו.
      </div>
      <div style="text-align:center;margin-top:20px;">
        <a href="https://plto.app/" style="color:var(--blue);font-size:13px;">לאתר PLTO</a>
      </div>
    </div>
  </div>

  <div class="page-footer">
    נוצר ע"י <a href="https://plto.app/">PLTO</a><br>
    פלטפורמה לניהול לידים ועסקאות לאנשי מקצוע
  </div>
</div>

<script>
'use strict';

const SUPABASE_URL = 'https://scyfywvzoogfrlalgftv.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjeWZ5d3Z6b29nZnJsYWxnZnR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MDA3MzAsImV4cCI6MjA5NjA3NjczMH0._D8ho0Yj8fEk7nd6-vmkjKkKyjfvHDmSq9Y8h5XzQCM';
const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Minimal, self-contained per-vertical labels, this file is fully static/
// standalone (same pattern as page.html/sign.html/portfolio.html) and never
// loads index.html's own copy.
const VERTICAL_COPY = {
  realestate: { stageNoun: 'שלב העסקה', checklistTitle: 'התקדמות' },
  realestate_lawyer: { stageNoun: 'שלב הטיפול בתיק', checklistTitle: 'צ׳ק ליסט מסמכים' },
  interior: { stageNoun: 'שלב הפרויקט', checklistTitle: 'צ׳ק ליסט פרויקט' },
  other: { stageNoun: 'שלב', checklistTitle: 'התקדמות' },
};

function fmtRelTime(iso) {
  const d = new Date(iso);
  const diffMs = Date.now() - d.getTime();
  const days = Math.floor(diffMs / 86400000);
  if (days <= 0) return 'היום';
  if (days === 1) return 'אתמול';
  if (days < 7) return 'לפני ' + days + ' ימים';
  return d.toLocaleDateString('he-IL');
}

function stageRow(stage, state) {
  const row = document.createElement('div');
  row.className = 'stage-row';

  const dotWrap = document.createElement('div');
  dotWrap.className = 'stage-dot-wrap';
  const dot = document.createElement('div');
  dot.className = 'stage-dot' + (state === 'done' ? ' done' : state === 'current' ? ' current' : '');
  dotWrap.appendChild(dot);
  if (!stage._last) {
    const line = document.createElement('div');
    line.className = 'stage-line' + (state === 'done' ? ' done' : '');
    dotWrap.appendChild(line);
  }
  row.appendChild(dotWrap);

  const label = document.createElement('div');
  label.className = 'stage-label' + (state === 'current' ? ' current' : state === 'done' ? ' done' : '');
  label.textContent = stage.name || '';
  row.appendChild(label);

  return row;
}

function checklistRow(item, done) {
  const row = document.createElement('div');
  row.className = 'cl-item' + (done ? ' done' : '');
  const check = document.createElement('div');
  check.className = 'cl-check' + (done ? ' done' : '');
  check.textContent = done ? '✓' : '';
  row.appendChild(check);
  const label = document.createElement('div');
  label.textContent = item.label || '';
  row.appendChild(label);
  return row;
}

function updateRow(u) {
  const row = document.createElement('div');
  row.className = 'upd-item';

  const icon = document.createElement('div');
  icon.className = 'upd-icon';
  icon.textContent = u.icon || '📌';
  row.appendChild(icon);

  const body = document.createElement('div');
  body.style.flex = '1';
  body.style.minWidth = '0';

  const title = document.createElement('div');
  title.className = 'upd-title';
  title.textContent = u.title || '';
  body.appendChild(title);

  if (u.detail) {
    const detail = document.createElement('div');
    detail.className = 'upd-detail';
    detail.textContent = u.detail;
    body.appendChild(detail);
  }

  const time = document.createElement('div');
  time.className = 'upd-time';
  time.textContent = fmtRelTime(u.created_at);
  body.appendChild(time);

  row.appendChild(body);
  return row;
}

const Tracker = {
  show(id) {
    ['state-loading', 'state-ready', 'state-unavailable'].forEach(s => {
      document.getElementById(s).classList.toggle('active', s === id);
    });
  },

  async init() {
    this.show('state-loading');
    const params = new URLSearchParams(location.search);
    const slug = params.get('p') || '';

    if (!slug || !/^[a-f0-9]{16}$/.test(slug)) {
      this.show('state-unavailable');
      return;
    }

    try {
      const { data, error } = await sbClient.rpc('get_public_lead_tracker', { p_slug: slug });
      if (error || !data?.available) {
        this.show('state-unavailable');
        return;
      }
      this.render(data);
      this.show('state-ready');
    } catch (e) {
      this.show('state-unavailable');
    }
  },

  render(data) {
    const cfg = VERTICAL_COPY[data.industry] || VERTICAL_COPY.other;

    document.getElementById('hdr-name').textContent = data.lead_name || '';
    document.getElementById('hdr-sub').textContent = 'מעקב חי, ' + (data.tenant_name || 'PLTO');

    const stages = Array.isArray(data.stages) ? data.stages : [];
    const currentIdx = stages.findIndex(s => s.id === data.current_stage_id);
    const currentStage = currentIdx >= 0 ? stages[currentIdx] : null;
    const wonSlot = document.getElementById('won-banner-slot');
    if (currentStage && currentStage.is_won) {
      const banner = document.createElement('div');
      banner.className = 'won-banner';
      const labels = { realestate: '🎉 העסקה נסגרה בהצלחה', realestate_lawyer: '🎉 הטיפול בתיק הושלם', interior: '🎉 הפרויקט הושלם' };
      banner.textContent = labels[data.industry] || '🎉 הושלם בהצלחה';
      wonSlot.appendChild(banner);
    }

    document.getElementById('stage-card-title').textContent = cfg.stageNoun;
    const track = document.getElementById('stage-track');
    track.innerHTML = '';
    stages.forEach((s, i) => {
      s._last = i === stages.length - 1;
      const state = i < currentIdx ? 'done' : i === currentIdx ? 'current' : 'pending';
      track.appendChild(stageRow(s, state));
    });

    const template = Array.isArray(data.checklist_template) ? data.checklist_template : [];
    if (template.length) {
      document.getElementById('checklist-card-title').textContent = cfg.checklistTitle;
      const state = data.checklist_state || {};
      const doneCount = template.filter(it => state[it.key]?.done).length;
      document.getElementById('cl-progress').textContent = doneCount + ' מתוך ' + template.length + ' הושלמו';
      const list = document.getElementById('checklist-list');
      list.innerHTML = '';
      template.forEach(it => list.appendChild(checklistRow(it, !!state[it.key]?.done)));
      document.getElementById('checklist-card').style.display = '';
    }

    const updates = Array.isArray(data.updates) ? data.updates : [];
    if (updates.length) {
      const list = document.getElementById('updates-list');
      list.innerHTML = '';
      updates.forEach(u => list.appendChild(updateRow(u)));
      document.getElementById('updates-card').style.display = '';
    }

    if (data.industry === 'realestate_lawyer') {
      document.getElementById('lawyer-disclaimer').style.display = '';
    }
  }
};

document.addEventListener('DOMContentLoaded', () => Tracker.init());
</script>
</body>
</html>
